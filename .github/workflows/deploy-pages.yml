name: Deploy NaanStop to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm --prefix frontend install
          npm --prefix admin install

      - name: Build Customer Store & Admin Dashboard
        run: |
          npm --prefix frontend run build
          npm --prefix admin run build
          cp -r admin/dist frontend/dist/admin
          cp frontend/dist/index.html frontend/dist/404.html
          cp frontend/dist/admin/index.html frontend/dist/admin/404.html
        env:
          VITE_BACKEND_URL: "https://naanstop-desi-api.loca.lt"
          VITE_FRONTEND_URL: "https://deekshag96.github.io/food-delivery-app"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
